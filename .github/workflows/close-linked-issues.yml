# GitHub only auto-closes "Closes #N" issues when a PR merges into the DEFAULT
# branch (main). Feature work here merges into next, so linked issues stayed
# open and nobody could tell shipped from pending (owner report, 2026-08-08).
# This closes same-repo issues named by closing keywords in the PR body when a
# PR merges into next, with a comment pointing back at the PR. main is left to
# GitHub's built-in behavior.
name: Close linked issues on next merges

on:
  pull_request:
    types: [closed]
    branches: [next]

permissions:
  issues: write

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body ?? '';
            const prNumber = context.payload.pull_request.number;
            // Same-repo bare "#N" refs only: cross-repo "owner/repo#N" refs are
            // deliberately skipped (this token has no rights there, and each
            // repo owns its own closing policy).
            const keyword = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)/gi;
            const issues = [...new Set([...body.matchAll(keyword)].map((m) => Number(m[1])))];
            for (const issue_number of issues) {
              const { owner, repo } = context.repo;
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ owner, repo, issue_number }));
              } catch {
                continue; // dangling reference — nothing to close
              }
              // A closing keyword can only close an ISSUE that is still open;
              // PR references parse identically but must never be touched.
              if (issue.pull_request || issue.state !== 'open') continue;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `Closed by #${prNumber}, merged into \`next\`. (Auto-closed by workflow — GitHub's built-in linking only fires on default-branch merges.)`,
              });
              await github.rest.issues.update({ owner, repo, issue_number, state: 'closed', state_reason: 'completed' });
            }
