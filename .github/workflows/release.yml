name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release whose zip upload failed, e.g. 1.10.13 (checks out tag v<version>, rebuilds, uploads woocommerce-pos.zip). Only for recovering a release the push run already created; it never creates one.'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a manual run, build the tag the release points at, not the
          # branch this workflow definition came from.
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}

      - name: 🔖 Check if version has changed
        id: check_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION=$(grep -oP "Version:\s*\K\d+(\.\d+)*(-\w+)?(\.\d+)?" woocommerce-pos.php)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git fetch --prune --unshallow
          LAST_TAG=$(git describe --tags --abbrev=0)
          echo "LAST_TAG=$LAST_TAG" >> "$GITHUB_ENV"
          if [[ -n "$INPUT_VERSION" ]]; then
            # Manual recovery: the 1.10.13 zip upload got an HTTP 500 from GitHub,
            # the run could not be retried, and a further push to main skips the
            # build because the tag already exists. Rebuild the tagged source and
            # upload the asset to the release that push run already created.
            if [[ "$VERSION" != "$INPUT_VERSION" ]]; then
              echo "::error::Tag v$INPUT_VERSION declares plugin version $VERSION; refusing to upload a mismatched zip"
              exit 1
            fi
            if ! ASSETS=$(gh release view "v$VERSION" --json assets --jq '.assets[].name'); then
              echo "::error::No release v$VERSION exists; a manual run only recovers an upload, it never creates a release"
              exit 1
            fi
            IS_DRAFT=$(gh release view "v$VERSION" --json isDraft --jq '.isDraft')
            if [[ "$IS_DRAFT" != "true" ]] && grep -qx 'woocommerce-pos.zip' <<< "$ASSETS"; then
              echo "::error::Release v$VERSION is published and already carries woocommerce-pos.zip; refusing to replace a shipped asset"
              exit 1
            fi
            echo "Recovering the zip upload for existing release v$VERSION..."
            {
              echo "release=true"
              echo "create_release=false"
            } >> "$GITHUB_OUTPUT"
          elif [[ "v$VERSION" == "$LAST_TAG" ]]; then
            echo "Version has not changed. Skipping release..."
            {
              echo "release=false"
              echo "create_release=false"
            } >> "$GITHUB_OUTPUT"
          elif gh release view "v$VERSION" --json isDraft >/dev/null 2>&1; then
            echo "Draft or published release v$VERSION already exists. Reusing it..."
            {
              echo "release=true"
              echo "create_release=false"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Version has changed. Creating new release..."
            {
              echo "release=true"
              echo "create_release=true"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: 📦 Create Release
        if: steps.check_version.outputs.create_release == 'true'
        id: create_release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          release_name: Release v${{ env.VERSION }}
          draft: true
          prerelease: ${{ contains(env.VERSION, '-beta') }}

      - name: 🏗 Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: 👷 Build
        if: steps.check_version.outputs.release == 'true'
        run: |
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile
          composer prefix-dependencies
          composer install --no-dev
          pnpm build

      - name: 📂 Sync to Temporary Directory
        if: steps.check_version.outputs.release == 'true'
        run: |
          mkdir temp_dir
          rsync -av --prune-empty-dirs --exclude-from='.distignore' ./ temp_dir/
      
      - name: 📦 Compress and Upload ZIP
        if: steps.check_version.outputs.release == 'true'
        run: |
          cd temp_dir
          zip -r ../woocommerce-pos.zip .
          cd ..
          gh release upload v${{ env.VERSION }} woocommerce-pos.zip --clobber
          rm -rf temp_dir
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
