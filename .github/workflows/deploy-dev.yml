name: Deploy to Dev Site

on:
  push:
    branches: [main, next]
  workflow_dispatch:

# Deploy uses an external SSH key to a Hetzner host; the GITHUB_TOKEN only reads.
permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  build:
    # Stable lane (main) deploys to the dev sites below. The `next` lane only
    # deploys once the dev-next target is configured: set repo variable
    # DEV_NEXT_SITES (e.g. "dev-next-free dev-next-pro"). Until then `next` is skipped.
    if: ${{ github.ref_name != 'next' || vars.DEV_NEXT_SITES != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗 Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: 👷 Build
        run: |
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile
          composer prefix-dependencies
          composer install --no-dev
          pnpm build

      - name: 📦 Create deployment package
        run: |
          # Create staging directory
          mkdir -p deploy-staging
          
          # Copy files excluding build artifacts and source files
          # NOTE: vendor/ is REQUIRED - it contains PHP classes loaded via composer
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='packages/*/node_modules' \
            --exclude='tests' \
            --exclude='assets/img/template-gallery/previews' \
            --exclude='fonts/packs' \
            --exclude='.gitignore' \
            --exclude='.editorconfig' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='package.json' \
            --exclude='pnpm-lock.yaml' \
            --exclude='pnpm-workspace.yaml' \
            --exclude='turbo.json' \
            --exclude='tsconfig.json' \
            --exclude='.eslintrc*' \
            --exclude='eslint.config.*' \
            --exclude='.prettierrc*' \
            --exclude='*.md' \
            --exclude='packages/*/src' \
            --exclude='packages/*/tsconfig.json' \
            --exclude='packages/*/package.json' \
            ./ deploy-staging/
          
          # Create tarball from staging directory
          cd deploy-staging
          tar -czf ../woocommerce-pos.tar.gz .
          cd ..

      - name: 📤 Upload deployment package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-package
          path: woocommerce-pos.tar.gz
          if-no-files-found: error
          overwrite: true

  deploy:
    needs: build
    if: ${{ github.ref_name != 'next' || vars.DEV_NEXT_SITES != '' }}
    # The `development` environment has a deployment branch policy (main/next
    # only) and deliberately NO required reviewers — dev deploys must stay
    # automatic. Scoping HETZNER_SSH_KEY as an environment secret (instead of
    # a repo secret) limits its release to jobs that pass this branch policy.
    environment: development
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download deployment package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deployment-package

      - name: 🔑 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Pinned server host key (public). If the server is rebuilt the deploy fails here:
          # read the new key on the server itself, never from ssh-keyscan.
          echo '213.239.218.130 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKbmOb9Bic/JfkQtj4L7Bjd4kk5nuRv++77tU6l3v822' > ~/.ssh/known_hosts

      - name: 🚀 Deploy to dev sites
        env:
          LANE: ${{ github.ref_name }}
          DEV_NEXT_SITES: ${{ vars.DEV_NEXT_SITES }}
        run: |
          TARBALL="woocommerce-pos-${GITHUB_RUN_ID}.tar.gz"

          # Target sites by lane: main -> stable dev sites; next -> dev-next sites
          # (from repo variable DEV_NEXT_SITES, e.g. "dev-next-free dev-next-pro").
          if [ "$LANE" = "next" ]; then
            IFS=$' \t\n' read -r -d '' -a SITES < <(printf '%s\0' "$DEV_NEXT_SITES")
          else
            SITES=(dev-free dev-pro)
          fi

          if [ "${#SITES[@]}" -eq 0 ]; then
            echo "DEV_NEXT_SITES must contain at least one deployment site" >&2
            exit 1
          fi

          for SITE in "${SITES[@]}"; do
            if ! [[ "$SITE" =~ ^[a-z0-9-]+$ ]]; then
              echo "Invalid deployment site: '$SITE'" >&2
              exit 1
            fi
          done
          echo "Deploying lane '$LANE' to: ${SITES[*]}"

          # Upload tarball with per-run name to avoid races
          /usr/bin/scp -o StrictHostKeyChecking=yes woocommerce-pos.tar.gz "root@213.239.218.130:/tmp/${TARBALL}"

          # OpenSSH flattens argv into one remote command string, so shell-quote
          # every argument and reconstruct the site array from positional args.
          /usr/bin/ssh -o StrictHostKeyChecking=yes root@213.239.218.130 "bash -s -- $(printf '%q ' "${TARBALL}" "${GITHUB_RUN_ID}" "${SITES[@]}")" << 'EOF'
            TARBALL="$1"
            RUN_ID="$2"
            shift 2
            SITES=("$@")
            set -e
            FAILED=0

            if [ "${#SITES[@]}" -eq 0 ]; then
              echo "No deployment sites received" >&2
              exit 1
            fi

            for SITE in "${SITES[@]}"; do
              if ! [[ "$SITE" =~ ^[a-z0-9-]+$ ]]; then
                echo "Invalid deployment site: '$SITE'" >&2
                exit 1
              fi
              # NOTE: this subshell is an `if` condition, so `set -e` is ignored
              # inside it (bash errexit rule) — every critical command carries an
              # explicit `|| exit 1` instead.
              if (
                SLUG="woocommerce-pos"
                PLUGINS="/data/wordpress/${SITE}/html/wp-content/plugins"
                STAGE="/data/wordpress/.wcpos-deploy"
                TMP_DIR="${STAGE}/${SITE}.${SLUG}.${RUN_ID}"
                OLD_DIR="${STAGE}/${SITE}.${SLUG}.old"
                umask 022

                # The copy is made where only this user can write.
                mkdir -p -m 700 "$STAGE" || exit 1
                if [ -L "$STAGE" ] || [ ! -O "$STAGE" ] || [ "$(stat -c %a "$STAGE")" != 700 ]; then
                  echo "❌ ${SITE}: ${STAGE} must be a mode 700 directory of this user" >&2
                  exit 1
                fi
                # Stay in the real plugins directory from here on, and only rename in and out of it.
                cd "$PLUGINS" || exit 1
                MOUNT=$(findmnt -no TARGET -T "$STAGE")
                if [ "$(/bin/pwd -P)" != "$PLUGINS" ] || [ "$(stat -c %d .)" != "$(stat -c %d "$STAGE")" ] ||
                  [ -z "$MOUNT" ] || [ "$(findmnt -no TARGET -T "$(/bin/pwd -P)")" != "$MOUNT" ]; then
                  echo "❌ ${SITE}: ${PLUGINS} must be a real path on the mount of ${STAGE}" >&2
                  exit 1
                fi
                # Put the live copy back if this run, or a killed one, stopped between the two moves below.
                there() { [ -e "$1" ] || [ -L "$1" ]; }
                put_back() { there "$SLUG" || ! there "$OLD_DIR" || mv -T "$OLD_DIR" "$SLUG"; }
                trap 'put_back || true; rm -rf "$TMP_DIR"' EXIT
                put_back || exit 1
                rm -rf "$TMP_DIR" "$OLD_DIR" || exit 1
                mkdir "$TMP_DIR" || exit 1
                tar --no-same-owner --no-same-permissions -xzf "/tmp/${TARBALL}" -C "$TMP_DIR" || exit 1

                # This runs as root on the host: only files, directories and links that stay inside, no loose modes.
                BAD=$(find "$TMP_DIR" -type l \( -lname '/*' -o -lname '*..*' \) \
                  -o ! -type l \( ! -type f ! -type d -o -perm /6022 \)) || exit 1
                if [ -n "$BAD" ]; then
                  echo "❌ ${SITE}: package rejected:" >&2
                  echo "$BAD" >&2
                  exit 1
                fi
                rm -rf "$TMP_DIR/.wcpos-deploy-run" || exit 1
                echo "$RUN_ID" > "$TMP_DIR/.wcpos-deploy-run" || exit 1
                chown -R 82:82 "$TMP_DIR" || exit 1

                if there "$SLUG"; then
                  mv -T "$SLUG" "$OLD_DIR" || exit 1
                fi
                mv -T "$TMP_DIR" "$SLUG" || exit 1
                rm -rf "$OLD_DIR" || exit 1

                # A green extract is not proof the runtime picked it up: php-fpm
                # reads the html tree through its own bind mount, which can hold
                # a stale directory inode (observed 2026-07-28 on dev-next —
                # files fresh on disk and via nginx, php serving pre-deploy
                # code for hours). Coolify does not honor compose
                # container_name, so discover the site's php container by its
                # bind mount, restart it (re-resolves the mount, clears
                # opcache), then verify the runtime sees this run's marker.
                HTML_DIR="/data/wordpress/${SITE}/html"
                PHP_FOUND=0
                for C in $(docker ps -q); do
                  docker inspect -f '{{range .Mounts}}{{.Source}}{{"\n"}}{{end}}' "$C" 2>/dev/null | grep -qx "$HTML_DIR" || continue
                  IMG=$(docker inspect -f '{{.Config.Image}}' "$C")
                  NAME=$(docker inspect -f '{{.Name}}' "$C" | sed 's|^/||')
                  case "$IMG $NAME" in
                    *fpm*|*php*) ;;
                    *) echo "ℹ️ ${SITE}: skipping non-php mount holder ${NAME} (${IMG})"; continue ;;
                  esac
                  PHP_FOUND=1
                  docker restart "$C" > /dev/null || exit 1
                  LIVE=$(docker exec "$C" cat /var/www/html/wp-content/plugins/woocommerce-pos/.wcpos-deploy-run 2>/dev/null || echo MISSING)
                  if [ "$LIVE" = "$RUN_ID" ]; then
                    echo "🔄 Restarted ${NAME}; runtime marker verified (${RUN_ID})"
                  else
                    echo "❌ ${NAME} restarted but runtime marker is '${LIVE}', expected '${RUN_ID}' — mount still stale" >&2
                    exit 1
                  fi
                done
                if [ "$PHP_FOUND" -eq 0 ]; then
                  echo "❌ no php container found mounting ${HTML_DIR}; running containers:" >&2
                  docker ps --format '  {{.Names}} ({{.Image}})' >&2
                  exit 1
                fi
              ); then
                echo "✅ Deployed to ${SITE}.wcpos.com"
              else
                echo "❌ Deploy failed for ${SITE}.wcpos.com" >&2
                # No break: attempt remaining sites; FAILED preserves the exit code.
                FAILED=1
              fi
            done

            rm -f "/tmp/${TARBALL}"
            [ "$FAILED" -eq 0 ] || exit 1
          EOF
