name: Review gate publisher
on:
  workflow_run:
    workflows: ["Review gate"]
    types: [completed]
permissions:
  actions: read
  statuses: write
  pull-requests: write
  contents: read
jobs:
  resolve:
    if: github.event.workflow_run.event != 'workflow_run'
    uses: wcpos/.github/.github/workflows/review-gate.yml@189027fa9321e55b31c8b2552b4002c562b15b2c # wcpos/.github main, 2026-10-17 (#13)
    with:
      resolve_only: true
      publish: false
      sha: ${{ github.event.workflow_run.head_sha }}
      head_owner: ${{ github.event.workflow_run.head_repository.owner.login }}
      head_branch: ${{ github.event.workflow_run.head_branch }}
  publish:
    needs: resolve
    if: needs.resolve.outputs.sha != ''
    uses: wcpos/.github/.github/workflows/review-gate.yml@189027fa9321e55b31c8b2552b4002c562b15b2c # wcpos/.github main, 2026-10-17 (#13)
    with:
      sha: ${{ needs.resolve.outputs.sha }}
