name: Review gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to evaluate
        required: true
        type: number
permissions:
  contents: read
  pull-requests: read
jobs:
  gate:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    uses: wcpos/.github/.github/workflows/review-gate.yml@d08fcf74d63b8a5848ad3a5a83c0be0e92655f5d # wcpos/.github main, 2026-10-19 (#21: docs-only PRs need no Codex review)
    with:
      publish: false
      # workflow_dispatch hands a `number` input over as a string, which the reusable workflow's
      # typed input rejects at validation ("Unexpected value '2309'", every dispatch since 2026-10-17).
      pr: ${{ fromJSON(inputs.pr || 0) }}
