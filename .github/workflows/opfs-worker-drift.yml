name: OPFS Worker Drift

# The POS web app loads its SQLite worker and WASM from THIS repo (Frontend.php builds the URL
# from PLUGIN_URL), not from the CDN bundle — so a bundle release does not reach web
# merchants until both assets are re-vendored here.
#
# The drift is caused by an event in another repo (a wcpos/web-bundle tag), which fires
# nothing here; hence the schedule as well as the PR trigger.
#
# main compares against the released `v<major.minor>.<patch>` tag the plugin's VERSION
# resolves to, which is what the page loads: a `2.0.0-beta.2` plugin loads `@2.0` from
# web-bundle.
#
# The `drift` job also checks that the worker's RXDB_VERSION has not moved inside a
# published plugin lane (major.minor): installed sites keep their old worker but load
# the newest bundle on their lane, and RxDB refuses any version mismatch (RM1). It is a
# step there, not its own job, because main's ruleset requires that job by name.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opfs-worker-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    # Keep this name: main's ruleset requires the context `🧵 OPFS worker matches the bundle`.
    name: 🧵 OPFS worker matches the bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the drift script
        run: bash .github/scripts/test-check-opfs-worker-drift.sh

      - name: Check the vendored worker and WASM against the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-opfs-worker-drift.sh

      # `!cancelled()`: report the RxDB lane check even when the drift check is red.
      - name: Test the worker RxDB lane script
        if: ${{ !cancelled() }}
        run: bash .github/scripts/test-check-worker-rxdb-minor.sh

      - name: Check the worker's RxDB version against the plugin's lane
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-worker-rxdb-minor.sh
