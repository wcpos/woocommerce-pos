name: Deploy to Dev Site

on:
  push:
    branches: [main, next]
  workflow_dispatch:

# Deploy uses an external SSH key to a Hetzner host; the GITHUB_TOKEN only reads.
permissions:
  contents: read

jobs:
  deploy:
    # Stable lane (main) deploys to the dev sites below. The `next` lane only
    # deploys once the dev-next target is configured: set repo variable
    # DEV_NEXT_SITES (e.g. "dev-next-free dev-next-pro"). Until then `next` is skipped.
    if: ${{ github.ref_name != 'next' || vars.DEV_NEXT_SITES != '' }}
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 🏗 Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: '11.1.1'

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'

      - name: 👷 Build
        run: |
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile
          composer prefix-dependencies
          composer install --no-dev
          pnpm build

      - name: 📦 Create deployment package
        run: |
          # Create staging directory
          mkdir -p deploy-staging
          
          # Copy files excluding build artifacts and source files
          # NOTE: vendor/ is REQUIRED - it contains PHP classes loaded via composer
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='packages/*/node_modules' \
            --exclude='tests' \
            --exclude='.gitignore' \
            --exclude='.editorconfig' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='package.json' \
            --exclude='pnpm-lock.yaml' \
            --exclude='pnpm-workspace.yaml' \
            --exclude='turbo.json' \
            --exclude='tsconfig.json' \
            --exclude='.eslintrc*' \
            --exclude='eslint.config.*' \
            --exclude='.prettierrc*' \
            --exclude='*.md' \
            --exclude='packages/*/src' \
            --exclude='packages/*/tsconfig.json' \
            --exclude='packages/*/package.json' \
            ./ deploy-staging/
          
          # Create tarball from staging directory
          cd deploy-staging
          tar -czf ../woocommerce-pos.tar.gz .
          cd ..

      - name: 🔑 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 213.239.218.130 >> ~/.ssh/known_hosts

      - name: 🚀 Deploy to dev sites
        env:
          LANE: ${{ github.ref_name }}
          DEV_NEXT_SITES: ${{ vars.DEV_NEXT_SITES }}
        run: |
          TARBALL="woocommerce-pos-${GITHUB_RUN_ID}.tar.gz"

          # Target sites by lane: main -> stable dev sites; next -> dev-next sites
          # (from repo variable DEV_NEXT_SITES, e.g. "dev-next-free dev-next-pro").
          if [ "$LANE" = "next" ]; then
            SITES="$DEV_NEXT_SITES"
          else
            SITES="dev-free dev-pro"
          fi
          echo "Deploying lane '$LANE' to: $SITES"

          # Upload tarball with per-run name to avoid races
          scp -o StrictHostKeyChecking=yes woocommerce-pos.tar.gz "root@213.239.218.130:/tmp/${TARBALL}"

          # printf %q each argument: OpenSSH flattens argv into ONE remote command
          # string, so an unquoted multi-word $SITES word-splits on the server —
          # the second site was silently never deployed.
          ssh -o StrictHostKeyChecking=yes root@213.239.218.130 "bash -s -- $(printf '%q ' "${TARBALL}" "${SITES}" "${GITHUB_RUN_ID}")" << 'EOF'
            TARBALL="$1"
            SITES="$2"
            RUN_ID="$3"
            set -e
            FAILED=0

            for SITE in $SITES; do
              # NOTE: this subshell is an `if` condition, so `set -e` is ignored
              # inside it (bash errexit rule) — every critical command carries an
              # explicit `|| exit 1` instead.
              if (
                PLUGIN_DIR="/data/wordpress/${SITE}/html/wp-content/plugins/woocommerce-pos"

                rm -rf "$PLUGIN_DIR" || exit 1
                mkdir -p "$PLUGIN_DIR" || exit 1
                tar -xzf "/tmp/${TARBALL}" -C "$PLUGIN_DIR" || exit 1
                echo "$RUN_ID" > "$PLUGIN_DIR/.wcpos-deploy-run" || exit 1

                chown -R 82:82 "$PLUGIN_DIR" || exit 1

                # A green extract is not proof the runtime picked it up: php-fpm
                # reads the html tree through its own bind mount, which can hold
                # a stale directory inode (observed 2026-07-28 on dev-next —
                # files fresh on disk and via nginx, php serving pre-deploy
                # code for hours). Coolify does not honor compose
                # container_name, so discover the site's php container by its
                # bind mount, restart it (re-resolves the mount, clears
                # opcache), then verify the runtime sees this run's marker.
                HTML_DIR="/data/wordpress/${SITE}/html"
                PHP_FOUND=0
                for C in $(docker ps -q); do
                  docker inspect -f '{{range .Mounts}}{{.Source}}{{"\n"}}{{end}}' "$C" 2>/dev/null | grep -qx "$HTML_DIR" || continue
                  IMG=$(docker inspect -f '{{.Config.Image}}' "$C")
                  NAME=$(docker inspect -f '{{.Name}}' "$C" | sed 's|^/||')
                  case "$IMG $NAME" in
                    *fpm*|*php*) ;;
                    *) echo "ℹ️ ${SITE}: skipping non-php mount holder ${NAME} (${IMG})"; continue ;;
                  esac
                  PHP_FOUND=1
                  docker restart "$C" > /dev/null || exit 1
                  LIVE=$(docker exec "$C" cat /var/www/html/wp-content/plugins/woocommerce-pos/.wcpos-deploy-run 2>/dev/null || echo MISSING)
                  if [ "$LIVE" = "$RUN_ID" ]; then
                    echo "🔄 Restarted ${NAME}; runtime marker verified (${RUN_ID})"
                  else
                    echo "❌ ${NAME} restarted but runtime marker is '${LIVE}', expected '${RUN_ID}' — mount still stale" >&2
                    exit 1
                  fi
                done
                if [ "$PHP_FOUND" -eq 0 ]; then
                  echo "❌ no php container found mounting ${HTML_DIR}; running containers:" >&2
                  docker ps --format '  {{.Names}} ({{.Image}})' >&2
                  exit 1
                fi
              ); then
                echo "✅ Deployed to ${SITE}.wcpos.com"
              else
                echo "❌ Deploy failed for ${SITE}.wcpos.com" >&2
                # No break: attempt remaining sites; FAILED preserves the exit code.
                FAILED=1
              fi
            done

            rm -f "/tmp/${TARBALL}"
            [ "$FAILED" -eq 0 ] || exit 1
          EOF
