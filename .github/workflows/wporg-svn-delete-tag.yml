name: Delete a WordPress.org SVN tag

# One-off maintenance: remove a stray directory under /tags on plugins.svn.wordpress.org
# (for example the `untagged-<hash>` directory created when a GitHub draft release was
# published with a placeholder tag on 2026-09-06). Refuses to delete the tag that trunk's
# `Stable tag` currently points at.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag directory name under /tags to delete (e.g. untagged-3d9b7ccddc54df87c672)
        required: true
        type: string

# Uses external SVN credentials to wordpress.org; the GITHUB_TOKEN only reads.
permissions:
  contents: read

jobs:
  delete:
    name: svn delete tags/${{ inputs.tag }}
    runs-on: ubuntu-latest
    env:
      SLUG: woocommerce-pos
      TAG: ${{ inputs.tag }}
    steps:
      - name: Install subversion
        run: |
          if ! command -v svn >/dev/null; then
            sudo apt-get update -q && sudo apt-get install -y -q subversion
          fi
          svn --version --quiet

      - name: Refuse to delete the stable tag or anything but one plain tag name
        run: |
          set -euo pipefail
          # A positive allowlist: one directory name, no dots-only segments, no
          # separators. `.` or `..` would canonicalise to /tags itself and delete
          # every tag; `*..*` alone let a bare `.` through.
          if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'; then echo "::error::refusing tag name '$TAG'"; exit 1; fi
          case "$TAG" in trunk|assets) echo "::error::refusing tag name '$TAG'"; exit 1;; esac
          STABLE=$(curl -fsS "https://plugins.svn.wordpress.org/$SLUG/trunk/readme.txt" | sed -n 's/^Stable tag:[[:space:]]*//p' | tr -d '\r' | head -1)
          echo "Stable tag on trunk: $STABLE"
          if [ "$TAG" = "$STABLE" ]; then echo "::error::'$TAG' is the current Stable tag; not deleting"; exit 1; fi
          # Ask SVN itself, not the HTTP mirror: no path squashing, no caching.
          if ! svn ls "https://plugins.svn.wordpress.org/$SLUG/tags/$TAG" --non-interactive >/dev/null; then echo "::error::tags/$TAG does not exist"; exit 1; fi

      - name: Delete the tag
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          set -euo pipefail
          svn delete "https://plugins.svn.wordpress.org/$SLUG/tags/$TAG" \
            -m "Remove stray tag $TAG" \
            --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
            --non-interactive --no-auth-cache
          # svn delete on a URL is a commit: it either succeeded above or exited
          # non-zero. Confirm through SVN, where a missing path is a clean error
          # rather than whatever the HTTP mirror happens to serve right now.
          if svn ls "https://plugins.svn.wordpress.org/$SLUG/tags/$TAG" --non-interactive >/dev/null 2>&1; then echo "::error::tags/$TAG still exists"; exit 1; fi
          echo "tags/$TAG deleted"
