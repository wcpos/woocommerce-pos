name: Review gate publisher
on:
  workflow_run:
    workflows: ["Review gate"]
    types: [completed]
permissions:
  actions: read
  statuses: write
  pull-requests: write
  contents: read
jobs:
  resolve:
    if: github.event.workflow_run.event != 'workflow_run'
    uses: wcpos/.github/.github/workflows/review-gate.yml@6c94f94a768cbcc437c73a82b497bf7435fba18a # wcpos/.github main, 2026-10-17 (#12)
    with:
      resolve_only: true
      publish: false
      sha: ${{ github.event.workflow_run.head_sha }}
      head_owner: ${{ github.event.workflow_run.head_repository.owner.login }}
      head_branch: ${{ github.event.workflow_run.head_branch }}
  publish:
    needs: resolve
    if: needs.resolve.outputs.sha != ''
    concurrency:
      group: review-gate-publish-${{ needs.resolve.outputs.sha }}
      cancel-in-progress: true
    uses: wcpos/.github/.github/workflows/review-gate.yml@6c94f94a768cbcc437c73a82b497bf7435fba18a # wcpos/.github main, 2026-10-17 (#12)
    with:
      sha: ${{ needs.resolve.outputs.sha }}
