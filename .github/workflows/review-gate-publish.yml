name: Review gate publisher
on:
  workflow_run:
    workflows: ["Review gate"]
    types: [completed]
permissions:
  statuses: write
  pull-requests: write
  contents: read
concurrency:
  group: review-gate-publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true
jobs:
  publish:
    if: github.event.workflow_run.event != 'workflow_run'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ github.event.workflow_run.pull_requests[0].number && github.event.workflow_run.pull_requests.*.number || fromJSON('[0]') }}
    uses: wcpos/.github/.github/workflows/review-gate.yml@07653d19695225dcbbe20c424baf95ee38a84080 # wcpos/.github main, 2026-10-17
    with:
      pr: ${{ matrix.pr }}
      sha: ${{ !matrix.pr && github.event.workflow_run.head_sha || '' }}
