name: Review gate publisher
on:
  workflow_run:
    workflows: ["Review gate"]
    types: [completed]
permissions:
  actions: read
  statuses: write
  pull-requests: write
  contents: read
jobs:
  resolve:
    if: github.event.workflow_run.event != 'workflow_run'
    uses: wcpos/.github/.github/workflows/review-gate.yml@d08fcf74d63b8a5848ad3a5a83c0be0e92655f5d # wcpos/.github main, 2026-10-19 (#21: docs-only PRs need no Codex review)
    with:
      resolve_only: true
      publish: false
      sha: ${{ github.event.workflow_run.head_sha }}
      head_owner: ${{ github.event.workflow_run.head_repository.owner.login }}
      head_branch: ${{ github.event.workflow_run.head_branch }}
  publish:
    needs: resolve
    if: needs.resolve.outputs.sha != ''
    uses: wcpos/.github/.github/workflows/review-gate.yml@d08fcf74d63b8a5848ad3a5a83c0be0e92655f5d # wcpos/.github main, 2026-10-19 (#21: docs-only PRs need no Codex review)
    with:
      sha: ${{ needs.resolve.outputs.sha }}
