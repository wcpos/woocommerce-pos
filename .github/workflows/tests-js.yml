name: JS Tests

on:
  push:
    branches:
      - main
      - next
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.js"
      - "**.jsx"
      - "package.json"
      - "packages/*/src/translations/locales/en/*.json"
      - ".github/scripts/test-deploy-dev-workflow.sh"
      - ".github/scripts/test-push-js-strings.sh"
      - ".github/workflows/deploy-dev.yml"
      - ".github/workflows/push-js-strings.yml"
      - ".github/workflows/tests-js.yml"
  pull_request:
    branches:
      - main
      - next
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.js"
      - "**.jsx"
      - "package.json"
      - "packages/*/src/translations/locales/en/*.json"
      - ".github/scripts/test-deploy-dev-workflow.sh"
      - ".github/scripts/test-push-js-strings.sh"
      - ".github/workflows/deploy-dev.yml"
      - ".github/workflows/push-js-strings.yml"
      - ".github/workflows/tests-js.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jest:
    name: Jest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate dev deployment workflow
        run: bash .github/scripts/test-deploy-dev-workflow.sh

      - name: Validate JS translation workflow
        run: bash .github/scripts/test-push-js-strings.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4
        with:
          version: '11.1.1'

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile

      - name: Run Jest tests
        run: pnpm run test:unit:js
